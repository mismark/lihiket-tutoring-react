<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon — SVG (self-contained, no external refs) ──────────────── -->
    <link rel="icon"            type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for Safari and older browsers -->
    <link rel="icon"            type="image/png"     href="/icon-192.png" sizes="192x192" />
    <link rel="shortcut icon"   type="image/png"     href="/icon-192.png" />
    <link rel="apple-touch-icon"                     href="/icon-180.png" />

    <!-- ── PWA / Web App Manifest ────────────────────────────────────────── -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Android Chrome / Samsung Internet -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lihiket" />
    <!-- Additional iOS icon sizes — prevents browser badge overlay -->
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <!-- Microsoft Tiles — override Edge defaults to use our icon -->
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/icon-maskable-192.png" />
    <meta name="msapplication-config"    content="none" />

    <!-- ── SEO ────────────────────────────────────────────────────────────── -->
    <meta name="description" content="Lihiket — Ethiopia's #1 Online Tutoring Platform. Live classes, quizzes, assignments, home tutoring and more." />
    <meta name="keywords" content="Lihiket, Lihiket Tutoring, lik tutoring, online tutoring Ethiopia, live classes Ethiopia, home tutoring Addis Ababa, Ethiopian tutoring platform, quizzes assignments Ethiopia" />
    <meta name="author" content="Lihiket Tutoring" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lihiket-tutoring.vercel.app" />
    <meta name="google-site-verification" content="MKJ_1AV9pQzqoX8a2TsFWIzOmAdIufcBKSYR6_OF9zQ" />

    <!-- ── Structured Data (JSON-LD) ─────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Lihiket Tutoring",
      "alternateName": ["Lihiket", "Lik Tutoring", "Lihiket Ethiopia"],
      "url": "https://lihiket-tutoring.vercel.app",
      "logo": "https://lihiket-tutoring.vercel.app/logo1.png",
      "description": "Ethiopia's #1 Online Tutoring Platform. Live classes, quizzes, assignments, home tutoring and more.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ET",
        "addressLocality": "Addis Ababa"
      },
      "sameAs": [],
      "offers": {
        "@type": "Offer",
        "description": "Online and home tutoring services including live classes, quizzes, assignments, and exams"
      }
    }
    </script>

    <!-- ── Open Graph (Facebook, Telegram, WhatsApp, TikTok) ──────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Lihiket Tutoring" />
    <meta property="og:description" content="Ethiopia's #1 Online Tutoring Platform — live classes, home tutoring, quizzes and more." />
    <meta property="og:image"       content="https://lihiket-tutoring.vercel.app/logo1.jpg" />
    <meta property="og:image:alt"   content="Lihiket Tutoring Logo" />
    <meta property="og:url"         content="https://lihiket-tutoring.vercel.app" />
    <meta property="og:site_name"   content="Lihiket" />

    <!-- ── Twitter / X card ──────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Lihiket Tutoring" />
    <meta name="twitter:description" content="Ethiopia's #1 Online Tutoring Platform." />
    <meta name="twitter:image"       content="https://lihiket-tutoring.vercel.app/logo1.jpg" />

    <title>Lihiket Tutoring</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
