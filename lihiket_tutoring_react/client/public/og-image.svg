<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="80"  r="200" fill="white" fill-opacity="0.04"/>
  <circle cx="150"  cy="550" r="150" fill="white" fill-opacity="0.04"/>
  <circle cx="950"  cy="480" r="120" fill="white" fill-opacity="0.06"/>

  <!-- Logo mark -->
  <rect x="80" y="180" width="100" height="100" rx="24" fill="white" fill-opacity="0.15"/>
  <path d="M105 200h18v55h42v18h-60V200z" fill="white"/>

  <!-- Wordmark -->
  <text x="200" y="258" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="72" fill="white">Lihiket.</text>

  <!-- Tagline -->
  <text x="80" y="320" font-family="Inter,system-ui,sans-serif" font-weight="400" font-size="28" fill="white" fill-opacity="0.80">
    Online Tutoring Platform
  </text>

  <!-- Features row -->
  <g font-family="Inter,system-ui,sans-serif" font-size="20" fill="white" fill-opacity="0.65">
    <text x="80"  y="400">📚 Subjects</text>
    <text x="240" y="400">🎙️ Live Classes</text>
    <text x="450" y="400">📋 Assignments</text>
    <text x="660" y="400">🧩 Quizzes</text>
    <text x="810" y="400">📝 Exams</text>
  </g>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
</svg>
