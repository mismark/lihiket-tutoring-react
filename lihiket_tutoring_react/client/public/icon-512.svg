<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Maskable safe zone = 80% of canvas = 409x409 centered -->
  </defs>

  <!-- Full bleed background (covers entire 512x512 for maskable) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind icon -->
  <radialGradient id="glow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Icon mark: rounded square, centered, within safe zone -->
  <rect x="136" y="136" width="240" height="240" rx="52" ry="52" fill="url(#iconGrad)"/>

  <!-- Letter L — bold, centered in the rounded square -->
  <text
    x="256" y="316"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="180"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="-4"
  >L</text>

  <!-- Small dot accent (brand element from logo.svg) -->
  <circle cx="318" cy="318" r="14" fill="#34d399"/>
</svg>
