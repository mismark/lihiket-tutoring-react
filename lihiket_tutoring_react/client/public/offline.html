<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Lihiket — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #020817;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .logo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 1.5rem;
      border: 2px solid rgba(255,255,255,0.1);
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.6;
    }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 0.875rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #10b981, #0d9488);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    .brand {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #334155;
    }
    .brand span { color: #34d399; }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="/logo1.png" alt="Lihiket" />
  </div>

  <div class="icon">📶</div>

  <h1>You're Offline</h1>
  <p>
    It looks like you've lost your internet connection.
    Lihiket needs to be online to load your lessons, assignments, and live classes.
    Please check your connection and try again.
  </p>

  <button class="btn" onclick="window.location.reload()">
    ↺ Try Again
  </button>

  <p class="brand">
    Lihiket<span>.</span> — Ethiopia's #1 Online Tutoring Platform
  </p>

</body>
</html>
