# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — Lihiket Tutoring Platform
# Copy to: /etc/nginx/sites-available/lihiket
# Enable: sudo ln -s /etc/nginx/sites-available/lihiket /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Upstream — PM2 cluster on port 5000
upstream lihiket_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (certbot auto-managed) ────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        image/svg+xml font/ttf font/opentype font/woff font/woff2;

    # ── Client max upload size (for lesson/document uploads) ─────────────────
    client_max_body_size 50M;

    # ── Static assets (Vite content-hashed) — cache 1 year ───────────────────
    location /assets/ {
        alias /var/www/lihiket/client/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Uploaded files (PDFs, videos, images) ────────────────────────────────
    location /uploads/ {
        alias /var/www/lihiket/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Prevent execution of uploaded files
        add_header Content-Disposition "inline";
    }

    # ── Socket.IO (WebSocket upgrade) ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://lihiket_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # keep WebSocket alive for 24h
    }

    # ── API routes ────────────────────────────────────────────────────────────
    location /api/ {
        # Apply rate limiting (auth endpoints have tighter limit)
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://lihiket_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # No caching for API responses
        add_header Cache-Control "no-store";
    }

    # Tighter rate limit on auth endpoints
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://lihiket_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React SPA — serve index.html for all other routes ────────────────────
    location / {
        root  /var/www/lihiket/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
